buildscript {
    ext {
        def buildToolsVersionFile = rootProject.file("build-tools-version.txt")
        if (!buildToolsVersionFile.isFile()) {
            throw new GradleException("Missing Android Build Tools version file: ${buildToolsVersionFile}")
        }
        def configuredBuildToolsVersion = buildToolsVersionFile.getText("UTF-8")
        if (configuredBuildToolsVersion.startsWith("\uFEFF")) {
            throw new GradleException("Android Build Tools version file must not contain a UTF-8 BOM")
        }
        configuredBuildToolsVersion = configuredBuildToolsVersion.trim()
        if (!(configuredBuildToolsVersion ==~ /\d+(?:\.\d+){1,3}(?:-[A-Za-z0-9][A-Za-z0-9.-]*)?/)) {
            throw new GradleException("Invalid Android Build Tools version: ${configuredBuildToolsVersion}")
        }
        buildToolsVersion = configuredBuildToolsVersion
        minSdkVersion = 24
        compileSdkVersion = 36
        targetSdkVersion = 36
        ndkVersion = "27.1.12297006"
        kotlinVersion = "2.1.20"
    }
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath("com.android.tools.build:gradle")
        classpath("com.facebook.react:react-native-gradle-plugin")
        classpath("org.jetbrains.kotlin:kotlin-gradle-plugin")
    }
}

apply plugin: "com.facebook.react.rootproject"

allprojects {
    repositories {
        google()
        mavenCentral()
        maven { url 'https://jitpack.io' }
    }
}
