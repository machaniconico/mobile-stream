# Required commercial-quality gate. The job name "test" is the branch
# protection status check expected on pull requests and main pushes.
name: CI
on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.11.0
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify native release configuration
        run: npm run verify:release-config

      - name: Run unit tests
        run: npm test

      - name: Typecheck web and React Native
        run: npm run typecheck

      - name: Build web prototype
        run: npm run build

      - name: Bundle React Native JavaScript
        run: npm run verify:rn
