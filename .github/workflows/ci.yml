# Required commercial-quality gate. The job name "test" is the branch
# protection status check expected on pull requests and main pushes.
name: CI
on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.11.0
          cache: npm

      - name: Setup Go for Gitleaks
        uses: actions/setup-go@v5
        with:
          go-version: 1.24.x
          cache: false

      - name: Install Gitleaks
        run: |
          go install github.com/gitleaks/gitleaks/v8@v8.30.1
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # ubuntu-latest no longer ships the Android SDK on PATH; install cmdline-tools first.
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses >/dev/null
          sdkmanager "platforms;android-36" "build-tools;36.0.0" "ndk;27.1.12297006"

      - name: Install dependencies
        run: npm ci

      - name: Verify release automation scripts
        run: npm run verify:scripts

      - name: Verify repository automation safety
        run: npm run verify:repo-automation

      - name: Verify native release configuration
        run: npm run verify:release-config

      - name: Verify Gitleaks history scan
        run: npm run verify:gitleaks-history

      - name: Run unit tests
        run: npm test

      - name: Typecheck web and React Native
        run: npm run typecheck

      - name: Build web prototype
        run: npm run build

      - name: Verify web bundle size
        run: npm run verify:web-bundle-size

      - name: Bundle React Native JavaScript
        run: npm run verify:rn

      - name: Verify source and bundle secret scan
        run: npm run verify:source-secrets

      # *.keystore is gitignored (commercial safety), so fresh checkouts have no
      # debug keystore. Generate the standard Android debug keystore for CI only.
      - name: Generate Android debug keystore
        run: |
          if [ ! -f android/app/debug.keystore ]; then
            keytool -genkeypair -v -storetype PKCS12 \
              -keystore android/app/debug.keystore \
              -storepass android -keypass android \
              -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Build Android native debug app
        run: npm run verify:android-native
